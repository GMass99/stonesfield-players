# The site now lives on Cloudflare Pages at stonesfieldplayers.co.uk.
# This file only matters for the old Netlify address: it forwards every
# page on stonesfieldplayers.netlify.app to the same page on the new domain.

[build]
  command = "npm run build"
  publish = "_site"

[build.environment]
  NODE_VERSION = "18"

[[redirects]]
  from = "/*"
  to = "https://stonesfieldplayers.co.uk/:splat"
  status = 301
  force = true
