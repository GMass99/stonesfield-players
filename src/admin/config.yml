# Logins are handled by DecapBridge (decapbridge.com), PKCE auth
backend:
  name: git-gateway
  repo: GMass99/stonesfield-players
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/b68d474a-de08-436a-bafa-5ce30b1f3066/pkce
  auth_token_endpoint: /sites/b68d474a-de08-436a-bafa-5ce30b1f3066/token
  gateway_url: https://gateway.decapbridge.com

  # See who did what
  commit_messages:
    create: Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

# Shown on the admin login screen
logo_url: /images/logo.jpg

# Adds a link back to the live site inside the admin panel
site_url: https://stonesfieldplayers.co.uk

media_folder: "src/images"
public_folder: "/images"

slug:
  encoding: "ascii"
  clean_accents: true


collections:

  # ============================================================
  # SHOWS & EVENTS (What's On page) — the thing that changes most,
  # so it comes first. Everyday fields first, the rest folded away.
  # ============================================================
  - name: "whats_on"
    label: "🎭 Shows & Events"
    description: "Add a new show, change dates, or add the ticket link."
    files:
      - name: "whats_on"
        label: "Shows & Events"
        file: "src/_data/events_page.json"
        fields:
          - name: "events"
            label: "Shows & events"
            label_singular: "show or event"
            widget: "list"
            summary: "{{fields.title}} — {{fields.day}} {{fields.month}} {{fields.year}}"
            hint: "Click a show to open it. Use 'Add show or event' at the bottom for a new one."
            fields:
              - { name: "title", label: "Show name", widget: "string" }
              - { name: "day", label: "Date(s)", widget: "string", hint: "e.g. 15, or 13–15, or TBC" }
              - { name: "month", label: "Month", widget: "string", hint: "e.g. November" }
              - { name: "year", label: "Year", widget: "string" }
              - { name: "time", label: "Start time", widget: "string", hint: "e.g. 7:30pm" }
              - { name: "location", label: "Venue", widget: "string", default: "Stonesfield Village Hall" }
              - { name: "description", label: "About the show", widget: "text" }
              - { name: "ticket_status", label: "Ticket message", widget: "string", hint: "e.g. 'Tickets on sale now', 'Tickets coming soon' or 'Sold out'" }
              - { name: "ticket_url", label: "Ticket link", widget: "string", required: false, hint: "Paste the Ticket Tailor link here. Leave empty if tickets aren't on sale yet." }
              - { name: "visible", label: "Show this on the website?", widget: "boolean", default: true, hint: "Switch off to hide an old show without deleting it." }
          - { name: "placeholder_text", label: "Message under the list of shows", widget: "text" }
          - name: "page_header"
            label: "Page heading (rarely changed)"
            widget: "object"
            collapsed: true
            fields:
              - { name: "subtitle", label: "Small text", widget: "string" }
              - { name: "title", label: "Heading", widget: "string" }
              - { name: "description", label: "Text under the heading", widget: "text" }
          - name: "past_events_banner"
            label: "'Missed a show?' box (rarely changed)"
            widget: "object"
            collapsed: true
            fields:
              - { name: "subtitle", label: "Small text", widget: "string" }
              - { name: "title", label: "Heading", widget: "string" }
              - { name: "description", label: "Text", widget: "text" }
              - { name: "link_text", label: "Button text", widget: "string" }
              - { name: "link_url", label: "Button goes to", widget: "string" }
          - name: "cta"
            label: "Box at the bottom of the page (rarely changed)"
            widget: "object"
            collapsed: true
            fields:
              - { name: "heading", label: "Heading", widget: "string" }
              - { name: "description", label: "Text", widget: "text" }
              - { name: "button_text", label: "Button text", widget: "string" }
              - { name: "button_url", label: "Button goes to", widget: "string" }

  # ============================================================
  # HOME PAGE — the "next show" banner is the only regular change
  # ============================================================
  - name: "home"
    label: "🏠 Home Page"
    description: "Update the 'next show' banner on the front page."
    files:
      - name: "home"
        label: "Home Page"
        file: "src/_data/home.json"
        fields:
          - name: "next_show"
            label: "Next show banner"
            widget: "object"
            fields:
              - { name: "visible", label: "Show the banner?", widget: "boolean", default: true }
              - { name: "title", label: "Show name", widget: "string" }
              - { name: "details", label: "Dates and venue", widget: "string", hint: "e.g. 25–27 June 2026 · Stonesfield Village Hall" }
              - { name: "subtitle", label: "Small text above the show name", widget: "string", hint: "e.g. Coming Soon, or Tickets On Sale" }
              - { name: "link_text", label: "Button text", widget: "string" }
              - { name: "link_url", label: "Button goes to", widget: "string", hint: "Leave as /events/ to send people to the What's On page." }
          - name: "hero"
            label: "Big heading at the top (rarely changed)"
            widget: "object"
            collapsed: true
            fields:
              - { name: "heading", label: "Main heading", widget: "string", hint: "Keep the <br> — it splits the heading onto two lines." }
              - { name: "description", label: "Text under the heading", widget: "text" }
              - { name: "cta_primary_text", label: "First button text", widget: "string" }
              - { name: "cta_primary_url", label: "First button goes to", widget: "string" }
              - { name: "cta_secondary_text", label: "Second button text", widget: "string" }
              - { name: "cta_secondary_url", label: "Second button goes to", widget: "string" }
          - name: "features_section"
            label: "Heading above the three boxes (rarely changed)"
            widget: "object"
            collapsed: true
            fields:
              - { name: "subtitle", label: "Small text", widget: "string" }
              - { name: "heading", label: "Heading", widget: "string" }
          - name: "features"
            label: "The three boxes (rarely changed)"
            label_singular: "box"
            widget: "list"
            summary: "{{fields.title}}"
            max: 3
            minimize_collapsed: true
            fields:
              - { name: "icon", label: "Emoji", widget: "string" }
              - { name: "title", label: "Heading", widget: "string" }
              - { name: "description", label: "Text", widget: "text" }
          - name: "cta"
            label: "Box at the bottom of the page (rarely changed)"
            widget: "object"
            collapsed: true
            fields:
              - { name: "heading", label: "Heading", widget: "string" }
              - { name: "description", label: "Text", widget: "text" }
              - { name: "button_text", label: "Button text", widget: "string" }
              - { name: "button_url", label: "Button goes to", widget: "string" }

  # ============================================================
  # PHOTOS & CONTACT (Contact page)
  # ============================================================
  - name: "contact"
    label: "📸 Photos & Contact"
    description: "Add photos to the gallery, or change the email address and venue."
    files:
      - name: "contact"
        label: "Photos & Contact"
        file: "src/_data/contact.json"
        fields:
          - name: "gallery"
            label: "Photo gallery"
            widget: "object"
            fields:
              - name: "photos"
                label: "Photos"
                label_singular: "photo"
                widget: "list"
                summary: "{{fields.caption}}"
                hint: "Use 'Add photo' at the bottom, then choose a picture from your computer."
                fields:
                  - { name: "image", label: "Photo", widget: "image" }
                  - { name: "caption", label: "Caption (optional)", widget: "string", required: false }
              - { name: "heading", label: "Gallery heading", widget: "string" }
          - { name: "email", label: "Group email address", widget: "string" }
          - name: "venue"
            label: "Venue"
            widget: "object"
            fields:
              - { name: "name", label: "Venue name", widget: "string" }
              - { name: "address", label: "Address", widget: "string" }
              - { name: "postcode", label: "Postcode", widget: "string" }
          - name: "join_box"
            label: "'Want to join?' box"
            widget: "object"
            collapsed: true
            fields:
              - { name: "heading", label: "Heading", widget: "string" }
              - { name: "text", label: "Text", widget: "text" }
          - name: "form_subjects"
            label: "Contact form subject choices (rarely changed)"
            label_singular: "choice"
            widget: "list"
            minimize_collapsed: true
            field: { name: "subject", label: "Choice", widget: "string" }
          - name: "page_header"
            label: "Page heading (rarely changed)"
            widget: "object"
            collapsed: true
            fields:
              - { name: "subtitle", label: "Small text", widget: "string" }
              - { name: "title", label: "Heading", widget: "string" }
              - { name: "description", label: "Text under the heading", widget: "text" }

  # ============================================================
  # ABOUT US & PAST SHOWS
  # ============================================================
  - name: "about"
    label: "📖 About Us & Past Shows"
    description: "Add a past production (with a photo), or update the group's story."
    files:
      - name: "about"
        label: "About Us & Past Shows"
        file: "src/_data/about.json"
        fields:
          - name: "productions"
            label: "Past productions"
            label_singular: "production"
            widget: "list"
            summary: "{{fields.title}} ({{fields.date_label}})"
            hint: "Use 'Add production' at the bottom for a new one."
            fields:
              - { name: "title", label: "Show name", widget: "string" }
              - { name: "date_label", label: "When", widget: "string", hint: "e.g. 'November 2025' or 'Pantomime'" }
              - { name: "description", label: "About the show", widget: "text" }
              - { name: "image", label: "Photo (optional)", widget: "image", required: false }
          - name: "intro"
            label: "Introduction and group photo"
            widget: "object"
            collapsed: true
            fields:
              - { name: "heading", label: "Heading", widget: "string" }
              - { name: "paragraphs", label: "Paragraphs", label_singular: "paragraph", widget: "list", field: { name: "paragraph", label: "Paragraph", widget: "text" } }
              - { name: "image", label: "Group photo", widget: "image", required: false }
              - { name: "cta_text", label: "Button text", widget: "string" }
              - { name: "cta_url", label: "Button goes to", widget: "string" }
          - name: "timeline"
            label: "History timeline (rarely changed)"
            label_singular: "entry"
            widget: "list"
            summary: "{{fields.year}} — {{fields.title}}"
            minimize_collapsed: true
            fields:
              - { name: "year", label: "Year", widget: "string", hint: "e.g. 1953, 1990s, 2025" }
              - { name: "title", label: "Title", widget: "string" }
              - { name: "description", label: "Text", widget: "text" }
          - name: "notable_members"
            label: "Notable members (rarely changed)"
            label_singular: "member"
            widget: "list"
            summary: "{{fields.name}}"
            minimize_collapsed: true
            fields:
              - { name: "icon", label: "Emoji", widget: "string", hint: "Paste an emoji like 🎬 or 🎭" }
              - { name: "name", label: "Name", widget: "string" }
              - { name: "description", label: "Text", widget: "text" }
          - name: "page_header"
            label: "Page heading (rarely changed)"
            widget: "object"
            collapsed: true
            fields:
              - { name: "subtitle", label: "Small text", widget: "string" }
              - { name: "title", label: "Heading", widget: "string" }
              - { name: "description", label: "Text under the heading", widget: "text" }
          - name: "productions_section"
            label: "Heading above past productions (rarely changed)"
            widget: "object"
            collapsed: true
            fields:
              - { name: "subtitle", label: "Small text", widget: "string" }
              - { name: "heading", label: "Heading", widget: "string" }
          - name: "timeline_section"
            label: "Heading above the timeline (rarely changed)"
            widget: "object"
            collapsed: true
            fields:
              - { name: "subtitle", label: "Small text", widget: "string" }
              - { name: "heading", label: "Heading", widget: "string" }
          - name: "notable_members_section"
            label: "Heading above notable members (rarely changed)"
            widget: "object"
            collapsed: true
            fields:
              - { name: "subtitle", label: "Small text", widget: "string" }
              - { name: "heading", label: "Heading", widget: "string" }
          - name: "cta"
            label: "Box at the bottom of the page (rarely changed)"
            widget: "object"
            collapsed: true
            fields:
              - { name: "heading", label: "Heading", widget: "string" }
              - { name: "description", label: "Text", widget: "text" }
              - { name: "button_text", label: "Button text", widget: "string" }
              - { name: "button_url", label: "Button goes to", widget: "string" }

  # ============================================================
  # SOCIAL MEDIA & SETTINGS
  # ============================================================
  - name: "settings"
    label: "⚙️ Social Media & Settings"
    description: "Instagram and Facebook links, logo and footer text."
    files:
      - name: "site"
        label: "Social Media & Settings"
        file: "src/_data/site.json"
        fields:
          - name: "social_links"
            label: "Social media links"
            label_singular: "social media link"
            widget: "list"
            summary: "{{fields.platform}} — {{fields.handle}}"
            fields:
              - { name: "platform", label: "Which site", widget: "string", hint: "e.g. Instagram, Facebook" }
              - { name: "icon", label: "Emoji", widget: "string", hint: "e.g. 📷 for Instagram, 👍 for Facebook" }
              - { name: "url", label: "Link to your page", widget: "string", hint: "The full web address, e.g. https://www.instagram.com/stonesfieldplayers/" }
              - { name: "handle", label: "Name shown on the site", widget: "string", hint: "e.g. @stonesfieldplayers" }
          - { name: "name", label: "Group name (rarely changed)", widget: "string" }
          - { name: "tagline", label: "Short description in the footer (rarely changed)", widget: "text" }
          - { name: "copyright_year", label: "Copyright year in the footer", widget: "string" }
          - { name: "logo", label: "Logo (rarely changed)", widget: "image" }
